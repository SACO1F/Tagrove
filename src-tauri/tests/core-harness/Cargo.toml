[package]
name = "shiqian-core-checks"
version = "0.3.0"
edition = "2021"

[lib]
path = "lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.39.0", features = ["bundled", "backup", "fallible_uint"] }
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"
unicode-casefold = "0.2"
unicode-segmentation = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
toml = "0.8"
tempfile = "3"
open = "5"
encoding_rs = "0.8"
fs2 = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }
quick-xml = "0.42"
pdf-extract = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_Security_Cryptography"] }
