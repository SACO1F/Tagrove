[package]
name = "shiqian"
version = "0.6.11"
description = "Local file tagging workspace"
edition = "2021"
rust-version = "1.90"

[lib]
name = "shiqian_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.39.0", features = ["bundled", "backup", "fallible_uint"] }
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"
unicode-casefold = "0.2"
unicode-segmentation = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
toml = "0.8"
tempfile = "3"
open = "5"
encoding_rs = "0.8"
fs2 = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }
quick-xml = "0.42"
pdf-extract = "0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemServices"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_Security_Cryptography", "Win32_System_Registry"] }

[profile.release]
strip = true
codegen-units = 1
lto = "thin"
opt-level = "s"
